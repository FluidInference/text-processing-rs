name: Publish Crate

on:
  push:
    tags:
      - "v*"

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable

      # crates.io and npm publish from the same tag, so the tag must match
      # Cargo.toml (#103: crates.io sat at 0.2.2 while npm moved on).
      - name: Check version
        id: version
        run: |
          version=$(cargo metadata --no-deps --format-version 1 | jq -r '.packages[0].version')
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "Tag $GITHUB_REF_NAME does not match Cargo.toml version $version"
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

      # A version already on crates.io is skipped, so a re-run, or a release
      # published by hand, doesn't fail the job.
      - name: Publish
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          if curl -sf -A "text-processing-rs release workflow" \
              "https://crates.io/api/v1/crates/text-processing-rs/$VERSION" >/dev/null; then
            echo "text-processing-rs@$VERSION is already on crates.io; nothing to publish."
          else
            cargo publish
          fi
