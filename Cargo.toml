[package]
name = "text-processing-rs"
version = "0.3.4"
edition = "2021"
license = "Apache-2.0"
description = "Text normalization (TN) and inverse text normalization (ITN): convert between written and spoken forms, ported from NeMo"
repository = "https://github.com/FluidInference/text-processing-rs"
keywords = ["asr", "speech", "normalization", "nlp", "itn"]
categories = ["text-processing"]

[lib]
crate-type = ["lib", "staticlib", "cdylib"]

[dependencies]
lazy_static = "1"
wasm-bindgen = { version = "0.2", optional = true }
js-sys = { version = "0.3", optional = true, default-features = false }
console_error_panic_hook = { version = "0.1", optional = true }
# Optional: byte-exact NeMo parity via compiled weighted FST grammars.
# Off by default — the pure-Rust rule path carries no rustfst/OpenFST weight.
rustfst = { version = "1.3.1", optional = true }
flate2 = { version = "1", optional = true }

# rustfst depends on rand 0.9 -> getrandom 0.3, which only builds for
# wasm32-unknown-unknown with its `wasm_js` backend. The `wasm` feature turns
# that on (0.3.4+ needs no RUSTFLAGS); the FST engine never draws random numbers.
[target.'cfg(all(target_arch = "wasm32", target_os = "unknown"))'.dependencies]
getrandom = { version = "0.3.4", optional = true }

[dev-dependencies]
proptest = "1"

[features]
default = []
ffi = []  # Enable C FFI bindings
wasm = ["dep:wasm-bindgen", "dep:js-sys", "dep:console_error_panic_hook", "getrandom?/wasm_js"]
# Byte-exact NeMo parity engine (runs NeMo's compiled grammars via rustfst).
# Adds rustfst + flate2 and ~8 MB of gzipped grammars (all languages combined).
fst-engine = ["dep:rustfst", "dep:flate2", "dep:getrandom"]

# Skip wasm-opt: wasm-pack's binaryen download is a recurring CI flake, and the
# published bundle does not need the size optimization for our use.
[package.metadata.wasm-pack.profile.release]
wasm-opt = false
